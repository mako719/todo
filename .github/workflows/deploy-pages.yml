# main に push されたら、フロントエンドを静的ビルドして GitHub Pages に公開する
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 画面から手動実行もできるようにする

# Pages へのデプロイに必要な権限
permissions:
  contents: read
  pages: write
  id-token: write

# デプロイが重なったら、古いほうは待たせず新しいほうだけ実行する
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build (static export)
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_STORAGE: local
          # https://<ユーザー名>.github.io/<リポジトリ名>/ で公開されるため
          PAGES_BASE_PATH: /${{ github.event.repository.name }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
